<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchbay</title>
    <script>
      // Aplica o tema antes do primeiro paint (sem flash). Preferência: dark | light | system.
      (() => {
        var pref = "dark";
        try { pref = JSON.parse(localStorage.getItem("patchbay.settings")).state.theme; } catch {}
        if (!/^(dark|light|system)$/.test(pref)) pref = "dark";
        var light = pref === "light" || (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
